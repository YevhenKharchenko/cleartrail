<section class="section faq-section" id="faq">
  <div class="faq-bg-wrapper">
    <div class="container faq-container">
      <div class="faq-content-wrapper">
        <div class="features-text-wrapper">
          <h2 class="section-title faq-title">Common Questions</h2>
          <img
            class="faq-img"
            src="./img/faq/faq-img.png"
            alt="Screenshot of the game"
            width="172"
            height="184"
            loading="lazy"
          />
        </div>
        <ul class="faq-list">
          <li class="faq-list-item">
            <div class="faq-item-question-wrapper">
              <button class="faq-top-text-btn">
                <span class="faq-toggle-symbol"
                  ><svg class="faq-icon" width="32" height="32">
                    <use href="./img/sprite.svg#icon-plus"></use></svg
                ></span>
                <div class="faq-item-text-wrapper">
                  <p class="faq-btn-text">Is the game free to download?</p>
                  <p class="faq-bottom-text">
                    Yeah, you can grab the whole game for free and play through
                    most of it without spending a cent. We show a few ads here
                    and there to help pay for development, but they won't
                    interrupt you while you're in the middle of solving a
                    puzzle. If you really hate ads, there’s a cheap option in
                    the menu to turn them off for good.
                  </p>
                </div>
              </button>
            </div>
          </li>
          <li class="faq-list-item">
            <div class="faq-item-question-wrapper">
              <button class="faq-top-text-btn">
                <span class="faq-toggle-symbol"
                  ><svg class="faq-icon" width="32" height="32">
                    <use href="./img/sprite.svg#icon-plus"></use></svg
                ></span>
                <div class="faq-item-text-wrapper">
                  <p class="faq-btn-text">
                    Can I play this without an internet connection?
                  </p>
                  <p class="faq-bottom-text">
                    Absolutely, the game works 100% offline once you've
                    downloaded it. It’s perfect for flights or places where the
                    Wi-Fi is terrible because all the logic is handled right on
                    your phone. You only need to go online if you want to update
                    the app or check the global leaderboards.
                  </p>
                </div>
              </button>
            </div>
          </li>
          <li class="faq-list-item">
            <div class="faq-item-question-wrapper">
              <button class="faq-top-text-btn">
                <span class="faq-toggle-symbol"
                  ><svg class="faq-icon" width="32" height="32">
                    <use href="./img/sprite.svg#icon-plus"></use></svg
                ></span>
                <div class="faq-item-text-wrapper">
                  <p class="faq-btn-text">
                    What happens if I get stuck on a level?
                  </p>
                  <p class="faq-bottom-text">
                    Don't worry, every level has a solution, even the ones that
                    look impossible at first glance. If you’re really
                    struggling, there’s a "Solution" button that will show you
                    the first few moves to get you moving again. Usually, just
                    resetting the board and looking at it from a different
                    perspective is enough to find the way.
                  </p>
                </div>
              </button>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
